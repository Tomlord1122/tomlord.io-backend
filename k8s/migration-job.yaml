apiVersion: batch/v1
kind: Job
metadata:
  name: tomlord-io-db-migration
  namespace: tomlord-io
spec:
  template:
    spec:
      restartPolicy: Never
      containers:
      - name: migration
        image: migrate/migrate:latest
        command: ["migrate"]
        args: [
          "-path", "/migrations",
          "-database", "$(DATABASE_URL)",
          "up"
        ]
        env:
        - name: DATABASE_URL
          value: "postgresql://$(BLUEPRINT_DB_USERNAME):$(BLUEPRINT_DB_PASSWORD)@$(BLUEPRINT_DB_HOST):$(BLUEPRINT_DB_PORT)/$(BLUEPRINT_DB_DATABASE)?sslmode=require"
        - name: BLUEPRINT_DB_HOST
          valueFrom:
            secretKeyRef:
              name: tomlord-io-secrets
              key: BLUEPRINT_DB_HOST
        - name: BLUEPRINT_DB_DATABASE
          valueFrom:
            secretKeyRef:
              name: tomlord-io-secrets
              key: BLUEPRINT_DB_DATABASE
        - name: BLUEPRINT_DB_USERNAME
          valueFrom:
            secretKeyRef:
              name: tomlord-io-secrets
              key: BLUEPRINT_DB_USERNAME
        - name: BLUEPRINT_DB_PASSWORD
          valueFrom:
            secretKeyRef:
              name: tomlord-io-secrets
              key: BLUEPRINT_DB_PASSWORD
        - name: BLUEPRINT_DB_PORT
          valueFrom:
            configMapKeyRef:
              name: tomlord-io-config
              key: BLUEPRINT_DB_PORT
        volumeMounts:
        - name: migrations
          mountPath: /migrations
      volumes:
      - name: migrations
        configMap:
          name: tomlord-io-migrations
  backoffLimit: 3 