apiVersion: batch/v1
kind: Job
metadata:
  name: tomlord-io-db-migration
  namespace: tomlord-io
spec:
  template:
    spec:
      restartPolicy: Never
      containers:
      - name: migration
        image: postgres:17.5-alpine3.22
        command: ["sh"]
        args: [
          "-c",
          "echo '等待數據庫就緒...' && until pg_isready -h $BLUEPRINT_DB_HOST -p $BLUEPRINT_DB_PORT -U $BLUEPRINT_DB_USERNAME -d $BLUEPRINT_DB_DATABASE; do echo '數據庫未就緒，等待...'; sleep 2; done && echo '數據庫就緒，開始執行 migration...' && cd /migrations && ls -la && for file in *.up.sql; do echo \"執行 $file\"; PGPASSWORD=$BLUEPRINT_DB_PASSWORD psql -h $BLUEPRINT_DB_HOST -p $BLUEPRINT_DB_PORT -U $BLUEPRINT_DB_USERNAME -d $BLUEPRINT_DB_DATABASE -f $file; if [ $? -eq 0 ]; then echo \"$file 執行成功\"; else echo \"$file 執行失敗\"; exit 1; fi; done && echo 'Migration 完成'"
        ]
        env:
        - name: BLUEPRINT_DB_HOST
          valueFrom:
            secretKeyRef:
              name: tomlord-io-secrets
              key: BLUEPRINT_DB_HOST
        - name: BLUEPRINT_DB_DATABASE
          valueFrom:
            secretKeyRef:
              name: tomlord-io-secrets
              key: BLUEPRINT_DB_DATABASE
        - name: BLUEPRINT_DB_USERNAME
          valueFrom:
            secretKeyRef:
              name: tomlord-io-secrets
              key: BLUEPRINT_DB_USERNAME
        - name: BLUEPRINT_DB_PASSWORD
          valueFrom:
            secretKeyRef:
              name: tomlord-io-secrets
              key: BLUEPRINT_DB_PASSWORD
        - name: BLUEPRINT_DB_PORT
          valueFrom:
            configMapKeyRef:
              name: tomlord-io-config
              key: BLUEPRINT_DB_PORT
        volumeMounts:
        - name: migrations
          mountPath: /migrations
      volumes:
      - name: migrations
        configMap:
          name: tomlord-io-migrations
  backoffLimit: 3