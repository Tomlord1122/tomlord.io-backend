apiVersion: v1
kind: ConfigMap
metadata:
  name: tomlord-io-config
  namespace: tomlord-io
data:
  PORT: "8080"
  APP_ENV: "minikube"
  BLUEPRINT_DB_PORT: "5432"
  BLUEPRINT_DB_SCHEMA: "public"
  # WebSocket and CORS configuration
  ALLOWED_ORIGINS: "http://localhost:5173,http://localhost:3000,http://localhost:4173,http://minikube.local,http://192.168.49.2,http://192.168.49.1"
  FRONTEND_URL: "http://localhost:5173"
  # Non-sensitive configurations only
  # Sensitive data should go in secrets