apiVersion: v1
kind: Secret
metadata:
  name: tomlord-io-secrets
  namespace: tomlord-io
type: Opaque
data:
  # Base64 encoded values - replace with actual values
  # Use: echo -n "your-value" | base64
  BLUEPRINT_DB_HOST: <base64-encoded-db-host>
  BLUEPRINT_DB_DATABASE: <base64-encoded-db-name>
  BLUEPRINT_DB_USERNAME: <base64-encoded-db-username>
  BLUEPRINT_DB_PASSWORD: <base64-encoded-db-password>
  JWT_SECRET: <base64-encoded-jwt-secret>
  SESSION_SECRET: <base64-encoded-session-secret>
  GOOGLE_CLIENT_ID: <base64-encoded-google-client-id>
  GOOGLE_CLIENT_SECRET: <base64-encoded-google-client-secret>
  GOOGLE_CALLBACK_URL: <base64-encoded-callback-url>

---
# Example commands to generate base64 values:
# echo -n "postgres-service" | base64
# echo -n "tomlord_production" | base64
# echo -n "tomlord" | base64
# echo -n "tomlord1122" | base64
# echo -n "your-jwt-secret" | base64
# echo -n "your-session-secret" | base64
# echo -n "your-google-client-id" | base64
# echo -n "your-google-client-secret" | base64
# echo -n "your-callback-url" | base64