apiVersion: v1
kind: Service
metadata:
  name: tomlord-io-backend-service
  namespace: tomlord-io
  labels:
    app: tomlord-io-backend
spec:
  selector:
    app: tomlord-io-backend
  ports:
  - name: http
    port: 80
    targetPort: 8080
    protocol: TCP
  type: ClusterIP

---
# Load Balancer for external access
apiVersion: v1
kind: Service
metadata:
  name: tomlord-io-backend-lb
  namespace: tomlord-io
  labels:
    app: tomlord-io-backend
  annotations:
    # AWS Load Balancer Controller annotations
    service.beta.kubernetes.io/aws-load-balancer-type: nlb
    service.beta.kubernetes.io/aws-load-balancer-scheme: internet-facing
    service.beta.kubernetes.io/aws-load-balancer-backend-protocol: tcp
    service.beta.kubernetes.io/aws-load-balancer-cross-zone-load-balancing-enabled: "true"
spec:
  selector:
    app: tomlord-io-backend
  ports:
  - name: http
    port: 80
    targetPort: 8080
    protocol: TCP
  - name: https
    port: 443
    targetPort: 8080
    protocol: TCP
  type: LoadBalancer 