<!DOCTYPE html>
<html>
<head>
    <title>WebSocket 測試</title>
    <style>
        body { font-family: Arial, sans-serif; margin: 20px; }
        #status { padding: 10px; margin: 10px 0; border-radius: 5px; }
        .connected { background-color: #d4edda; color: #155724; }
        .disconnected { background-color: #f8d7da; color: #721c24; }
        .error { background-color: #fff3cd; color: #856404; }
        #messages { height: 300px; overflow-y: auto; border: 1px solid #ccc; padding: 10px; margin: 10px 0; }
        .message { margin: 5px 0; padding: 5px; background-color: #f8f9fa; border-radius: 3px; }
        button { padding: 10px 20px; margin: 5px; cursor: pointer; }
    </style>
</head>
<body>
    <h1>WebSocket 連接測試</h1>
    
    <div>
        <label for="serverUrl">服務器地址:</label>
        <input type="text" id="serverUrl" value="ws://192.168.49.2:30227/ws" style="width: 300px;">
        <button onclick="connect()">連接</button>
        <button onclick="disconnect()">斷開</button>
    </div>
    
    <div id="status" class="disconnected">連接狀態: 未連接</div>
    
    <div>
        <label for="roomInput">房間名稱:</label>
        <input type="text" id="roomInput" value="test-room" style="width: 200px;">
        <button onclick="subscribe()">訂閱房間</button>
        <button onclick="unsubscribe()">取消訂閱</button>
    </div>
    
    <div>
        <label for="messageInput">測試消息:</label>
        <input type="text" id="messageInput" value="Hello WebSocket!" style="width: 200px;">
        <button onclick="sendTestMessage()">發送測試消息</button>
    </div>
    
    <div id="messages"></div>
    
    <script>
        let ws = null;
        const statusDiv = document.getElementById('status');
        const messagesDiv = document.getElementById('messages');
        const serverUrlInput = document.getElementById('serverUrl');
        const roomInput = document.getElementById('roomInput');
        const messageInput = document.getElementById('messageInput');
        
        function updateStatus(message, className) {
            statusDiv.textContent = '連接狀態: ' + message;
            statusDiv.className = className;
        }
        
        function addMessage(message, type = 'info') {
            const messageDiv = document.createElement('div');
            messageDiv.className = 'message';
            messageDiv.innerHTML = `<strong>[${new Date().toLocaleTimeString()}] ${type}:</strong> ${message}`;
            messagesDiv.appendChild(messageDiv);
            messagesDiv.scrollTop = messagesDiv.scrollHeight;
        }
        
        function connect() {
            if (ws && ws.readyState === WebSocket.OPEN) {
                addMessage('已經連接', 'warning');
                return;
            }
            
            const url = serverUrlInput.value;
            addMessage(`嘗試連接到: ${url}`, 'info');
            
            try {
                ws = new WebSocket(url);
                
                ws.onopen = function() {
                    updateStatus('已連接', 'connected');
                    addMessage('WebSocket 連接成功', 'success');
                };
                
                ws.onmessage = function(event) {
                    try {
                        const message = JSON.parse(event.data);
                        addMessage(`收到消息: ${JSON.stringify(message, null, 2)}`, 'received');
                    } catch (e) {
                        addMessage(`收到原始消息: ${event.data}`, 'received');
                    }
                };
                
                ws.onclose = function(event) {
                    updateStatus('已斷開', 'disconnected');
                    addMessage(`WebSocket 連接關閉 (代碼: ${event.code})`, 'warning');
                };
                
                ws.onerror = function(error) {
                    updateStatus('連接錯誤', 'error');
                    addMessage(`WebSocket 錯誤: ${error}`, 'error');
                };
                
            } catch (error) {
                addMessage(`連接失敗: ${error.message}`, 'error');
            }
        }
        
        function disconnect() {
            if (ws) {
                ws.close();
                ws = null;
            }
        }
        
        function subscribe() {
            if (!ws || ws.readyState !== WebSocket.OPEN) {
                addMessage('請先連接 WebSocket', 'error');
                return;
            }
            
            const room = roomInput.value;
            const message = {
                action: 'subscribe',
                rooms: [room]
            };
            
            ws.send(JSON.stringify(message));
            addMessage(`訂閱房間: ${room}`, 'info');
        }
        
        function unsubscribe() {
            if (!ws || ws.readyState !== WebSocket.OPEN) {
                addMessage('請先連接 WebSocket', 'error');
                return;
            }
            
            const room = roomInput.value;
            const message = {
                action: 'unsubscribe',
                rooms: [room]
            };
            
            ws.send(JSON.stringify(message));
            addMessage(`取消訂閱房間: ${room}`, 'info');
        }
        
        function sendTestMessage() {
            if (!ws || ws.readyState !== WebSocket.OPEN) {
                addMessage('請先連接 WebSocket', 'error');
                return;
            }
            
            const message = messageInput.value;
            ws.send(JSON.stringify({
                type: 'test',
                message: message
            }));
            addMessage(`發送測試消息: ${message}`, 'sent');
        }
        
        // 頁面加載時自動獲取 Minikube IP
        window.onload = function() {
            // 嘗試從 URL 參數獲取服務器地址
            const urlParams = new URLSearchParams(window.location.search);
            const serverParam = urlParams.get('server');
            if (serverParam) {
                serverUrlInput.value = serverParam;
            }
        };
    </script>
</body>
</html>
